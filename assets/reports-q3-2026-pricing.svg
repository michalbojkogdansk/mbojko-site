<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How observability vendors meter AI agent work</title>
<desc id="d">Three AI agent pricing meters across twelve vendors, retrieved September 24, 2026. Credits: Datadog $1.00 per credit on an annual commit, Dash0 $0.60 per credit. Tokens: Grafana Labs from $2 per million tokens beyond an included pool, Coralogix $1.50 per million for AI evaluation, Elastic managed LLMs $4.50 input and $21 output per million. Executions and generations: Elastic from $0.025 per Agent Builder execution, Grafana Agent Observability from $1.50 per thousand generations. Dynatrace, New Relic, Splunk, Chronosphere and Cribl publish no AI rate on the pages reviewed.</desc>
<defs><pattern id="hz" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="12" height="26" fill="#FFD600"/><rect x="12" width="14" height="26" fill="#111318"/></pattern></defs>
