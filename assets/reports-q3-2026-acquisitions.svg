<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Seven acquisitions, June 30 to September 27, 2026</title>
<desc id="d">Seven acquisitions announced or completed between June 30 and September 27, 2026: Datadog and Adaptive ML, Cribl and CardinalOps, Palo Alto Networks and Embrace, Dynatrace and Arize AI for $915 million, Dash0 and Polar Signals, Cribl and Radiant Security technology assets, Elastic and Deductive AI. Only the Arize price is stated in the published updates.</desc>
