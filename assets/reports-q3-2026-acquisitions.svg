<text x="60" y="594" font-size="13.8" fill="#8a92a6" font-weight="400" text-anchor="start" >Status at the end of the period: Arize pending as of September 27. Embrace closing expected in Palo Alto Networks' first fiscal quarter of 2027.</text>
